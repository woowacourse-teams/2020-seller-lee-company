plugins {
    id 'org.springframework.boot' version '2.3.1.RELEASE'
    id 'io.spring.dependency-management' version '1.0.9.RELEASE'
    id 'java'
}

group = 'sellerlee'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '1.8'

repositories {
    mavenCentral()
}

dependencies {
    // spring
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    // jwt
    implementation 'io.jsonwebtoken:jjwt:0.9.1'
    // apache
    implementation 'org.apache.commons:commons-lang3:3.10'
    // flyway
    implementation 'org.flywaydb:flyway-core'
    // mariaDB
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    // h2
    testImplementation 'com.h2database:h2'
    // rest assured
    testImplementation 'io.rest-assured:rest-assured:3.3.0'

    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
}

test {
    useJUnitPlatform()
}

processResources.dependsOn('copyDatabaseSecret')

task copyDatabaseSecret {
    dependsOn 'copyDatabaseSecretToMain'
    dependsOn 'copyDatabaseSecretToTest'
}

task copyDatabaseSecretToMain(type: Copy) {
    from('../seller-lee-secret') {
        include 'application-common.yml'
        include 'application-security.yml'
        include 'application-dev.yml'
    }
    into 'src/main/resources'
}

task copyDatabaseSecretToTest(type: Copy) {
    from('../seller-lee-secret') {
        include 'application-common.yml'
        include 'application-security.yml'
        include 'application-local.yml'
    }
    into 'src/test/resources'
}
